<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Command Center</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#121212" />
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192x192/121212/ffffff?text=HQ" />
  
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #1a1d24;
      --accent-kronir: #10b981;
      --accent-atu: #3b82f6;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --border: #282c37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px 16px 80px 16px; -webkit-tap-highlight-color: transparent; }
    header { margin-bottom: 24px; padding-top: 10px; }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    p.date { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }
    
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin: 20px 0 10px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .kronir-title { color: var(--accent-kronir); }
    .atu-title { color: var(--accent-atu); }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .task-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      accent-color: #3b82f6;
      cursor: pointer;
    }
    .task-content { flex: 1; }
    .task-title { font-size: 0.95rem; font-weight: 500; }
    .task-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
    .task-item.completed .task-title { text-decoration: line-through; color: var(--text-dim); }

    .btn-remind {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Daily Operations</h1>
    <p class="date" id="liveDate"></p>
  </header>

  <button class="btn-remind" onclick="setupNotifications()">🔔 Enable Incomplete Task Reminders</button>

  <!-- KRONIR SECTION -->
  <div class="section-title kronir-title">🌿 Kronir • Socials & Growth</div>
  <div class="card">
    <label class="task-item" id="k1">
      <input type="checkbox" onchange="toggleTask('k1')" />
      <div class="task-content">
        <div class="task-title">Plan & Schedule Daily Pipeline</div>
        <div class="task-sub">Plan visual grids, captions & asset batching</div>
      </div>
    </label>
    <label class="task-item" id="k2">
      <input type="checkbox" onchange="toggleTask('k2')" />
      <div class="task-content">
        <div class="task-title">Publish Main Reel on Feed</div>
        <div class="task-sub">Product hook, sound sync & comment pinning</div>
      </div>
    </label>
    <label class="task-item" id="k3">
      <input type="checkbox" onchange="toggleTask('k3')" />
      <div class="task-content">
        <div class="task-title">Publish Trial Reel</div>
        <div class="task-sub">Raw hook/format variation testing</div>
      </div>
    </label>
  </div>

  <!-- AKSHAY TRANSFORMER UDYOG SECTION -->
  <div class="section-title atu-title">⚡ Akshay Transformer Udyog</div>
  <div class="card">
    <label class="task-item" id="a1">
      <input type="checkbox" onchange="toggleTask('a1')" />
      <div class="task-content">
        <div class="task-title">Factory Visit & Physical Audit</div>
        <div class="task-sub">Floor inspection & ongoing assembly checkpoints</div>
      </div>
    </label>
    <label class="task-item" id="a2">
      <input type="checkbox" onchange="toggleTask('a2')" />
      <div class="task-content">
        <div class="task-title">Track Transformer Lots</div>
        <div class="task-sub">Stage sign-offs: winding, core assembly & testing</div>
      </div>
    </label>
    <label class="task-item" id="a3">
      <input type="checkbox" onchange="toggleTask('a3')" />
      <div class="task-content">
        <div class="task-title">Raw Material Inventory & Orders</div>
        <div class="task-sub">Review copper, CRGO, oil & issue supplier POs</div>
      </div>
    </label>
    <label class="task-item" id="a4">
      <input type="checkbox" onchange="toggleTask('a4')" />
      <div class="task-content">
        <div class="task-title">Daily Documentation & Submissions</div>
        <div class="task-sub">Inspection certificates, dispatch clearance & billing</div>
      </div>
    </label>
  </div>

  <script>
    document.getElementById('liveDate').innerText = new Date().toLocaleDateString('en-US', {
      weekday: 'long', month: 'short', day: 'numeric', year: 'numeric'
    });

    const tasks = ['k1', 'k2', 'k3', 'a1', 'a2', 'a3', 'a4'];

    function loadState() {
      tasks.forEach(id => {
        const checked = localStorage.getItem(id) === 'true';
        const el = document.getElementById(id);
        const input = el.querySelector('input');
        input.checked = checked;
        if (checked) el.classList.add('completed');
      });
    }

    function toggleTask(id) {
      const el = document.getElementById(id);
      const isChecked = el.querySelector('input').checked;
      localStorage.setItem(id, isChecked);
      el.classList.toggle('completed', isChecked);
    }

    function setupNotifications() {
      if (!('Notification' in window)) {
        alert('Notifications not supported by this browser.');
        return;
      }
      Notification.requestPermission().then(perm => {
        if (perm === 'granted') {
          alert('Reminders active. Pending tasks will notify every 2 hours.');
          setInterval(checkPendingTasks, 7200000); // Check every 2 hrs
        }
      });
    }

    function checkPendingTasks() {
      const remaining = tasks.filter(id => localStorage.getItem(id) !== 'true').length;
      if (remaining > 0 && Notification.permission === 'granted') {
        new Notification('Pending Work Alert', {
          body: `You still have ${remaining} incomplete tasks on today's docket.`
        });
      }
    }

    window.onload = loadState;
  </script>
</body>
</html>
